<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Snake Neo 1.0</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050510;
overflow:hidden;
color:white;
}

.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:15px;
}

.hidden{
display:none;
}

h1{
font-size:42px;
color:#00ffff;
text-shadow:0 0 20px cyan;
}

button{
width:250px;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
background:#00ffff;
color:black;
font-weight:bold;
}

button:active{
transform:scale(.95);
}

canvas{
background:#0a0a15;
display:none;
}

#hud{
position:absolute;
top:10px;
left:10px;
font-size:20px;
display:none;
}

select{
padding:10px;
font-size:18px;
border-radius:10px;
}
</style>
</head>
<body>

<div id="menu" class="screen">
<h1>SNAKE NEO</h1>

<button onclick="startGame()">Играть</button>
<button onclick="openSettings()">Настройки</button>

<p>Рекорд: <span id="best">0</span></p>
</div>

<div id="settings" class="screen hidden">

<h2>Настройки</h2>

<select id="controlType">
<option value="swipe">Свайпы</option>
<option value="tap">Тапы</option>
</select>

<button onclick="saveSettings()">Сохранить</button>
<button onclick="closeSettings()">Назад</button>

</div>

<div id="hud">
Очки: <span id="score">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let grid=20;

let snake;
let food;

let dx=grid;
let dy=0;

let score=0;
let best=localStorage.getItem("best")||0;

document.getElementById("best").textContent=best;

function resetGame(){

snake=[
{x:200,y:200}
];

food=randomFood();

dx=grid;
dy=0;

score=0;
document.getElementById("score").textContent=score;
}

function randomFood(){

return{
x:Math.floor(Math.random()*(canvas.width/grid))*grid,
y:Math.floor(Math.random()*(canvas.height/grid))*grid
};

}

function startGame(){

document.getElementById("menu").classList.add("hidden");
canvas.style.display="block";
document.getElementById("hud").style.display="block";

resetGame();

requestAnimationFrame(loop);

}

function drawSnake(){

ctx.shadowColor="#00ffff";
ctx.shadowBlur=15;

snake.forEach(part=>{
ctx.fillStyle="#00ffff";
ctx.fillRect(part.x,part.y,grid-2,grid-2);
});

}

function drawFood(){

ctx.shadowBlur=20;
ctx.shadowColor="#ff00ff";

ctx.fillStyle="#ff00ff";
ctx.fillRect(food.x,food.y,grid,grid);

}

let last=0;

function loop(time){

if(time-last<90){
requestAnimationFrame(loop);
return;
}

last=time;

ctx.clearRect(0,0,canvas.width,canvas.height);

let head={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(
head.x<0||
head.y<0||
head.x>=canvas.width||
head.y>=canvas.height
){
gameOver();
return;
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){

score++;

document.getElementById("score").textContent=score;

food=randomFood();

}else{
snake.pop();
}

for(let i=1;i<snake.length;i++){

if(
head.x===snake[i].x&&
head.y===snake[i].y
){
gameOver();
return;
}

}

drawFood();
drawSnake();

requestAnimationFrame(loop);

}

function gameOver(){

if(score>best){
best=score;
localStorage.setItem("best",best);
}

document.getElementById("best").textContent=best;

canvas.style.display="none";
document.getElementById("hud").style.display="none";

document.getElementById("menu").classList.remove("hidden");

}

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp"&&dy===0){
dx=0;dy=-grid;
}

if(e.key==="ArrowDown"&&dy===0){
dx=0;dy=grid;
}

if(e.key==="ArrowLeft"&&dx===0){
dx=-grid;dy=0;
}

if(e.key==="ArrowRight"&&dx===0){
dx=grid;dy=0;
}

});

let startX,startY;

document.addEventListener("touchstart",e=>{

startX=e.touches[0].clientX;
startY=e.touches[0].clientY;

});

document.addEventListener("touchend",e=>{

let control=localStorage.getItem("control")||"swipe";

let endX=e.changedTouches[0].clientX;
let endY=e.changedTouches[0].clientY;

let dxTouch=endX-startX;
let dyTouch=endY-startY;

if(control==="swipe"){

if(Math.abs(dxTouch)>Math.abs(dyTouch)){

if(dxTouch>0&&dx===0){
dx=grid;dy=0;
}

if(dxTouch<0&&dx===0){
dx=-grid;dy=0;
}

}else{

if(dyTouch>0&&dy===0){
dx=0;dy=grid;
}

if(dyTouch<0&&dy===0){
dx=0;dy=-grid;
}

}

}else{

if(endX<canvas.width/2){
dx=-grid;
dy=0;
}else{
dx=grid;
dy=0;
}

}

});

function openSettings(){

document.getElementById("menu").classList.add("hidden");
document.getElementById("settings").classList.remove("hidden");

}

function closeSettings(){

document.getElementById("settings").classList.add("hidden");
document.getElementById("menu").classList.remove("hidden");

}

function saveSettings(){

localStorage.setItem(
"control",
document.getElementById("controlType").value
);

closeSettings();

}

</script>

</body>
</html>

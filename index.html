<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Neo 1.01 Fixed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#050510;color:#fff;overflow:hidden;touch-action:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.hidden{display:none}
h1{color:#00ffff;text-shadow:0 0 15px #00ffff}
button,select{padding:14px 18px;border:none;border-radius:12px;font-size:18px}
button{background:#00ffff;font-weight:bold}
canvas{display:none;background:#0a0a15}
#hud{display:none;position:fixed;top:10px;left:10px;font-size:20px}
#gameover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);justify-content:center;align-items:center;flex-direction:column;gap:12px}
</style>
</head>
<body>

<div id="menu" class="screen">
<h1>SNAKE NEO 1.01</h1>
<button onclick="startGame()">Играть</button>
<button onclick="openSettings()">Настройки</button>
<div>Рекорд: <span id="best">0</span></div>
</div>

<div id="settings" class="screen hidden">
<h2>Настройки</h2>
<select id="controlType">
<option value="swipe">Свайпы</option>
<option value="tap">Тапы</option>
</select>
<button onclick="saveSettings()">Сохранить</button>
<button onclick="closeSettings()">Назад</button>
</div>

<div id="hud">Очки: <span id="score">0</span></div>

<div id="gameover">
<h2>Игра окончена</h2>
<div>Счёт: <span id="finalScore"></span></div>
<button onclick="restartGame()">Играть снова</button>
<button onclick="backToMenu()">Меню</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const grid=20;
let snake=[],food={},dx=grid,dy=0,score=0;
let running=false,lastTime=0,rafId=null;

let best=Number(localStorage.getItem("best")||0);
bestEl.textContent=best;

function randomFood(){
 let x,y,ok=false;
 while(!ok){
  x=Math.floor(Math.random()*(canvas.width/grid))*grid;
  y=Math.floor(Math.random()*(canvas.height/grid))*grid;
  ok=!snake.some(s=>s.x===x&&s.y===y);
 }
 return {x,y};
}

function resetGame(){
 snake=[{x:200,y:200}];
 dx=grid; dy=0;
 score=0;
 scoreEl.textContent=0;
 food=randomFood();
}

function startGame(){
 cancelAnimationFrame(rafId);
 running=true;
 lastTime=0;
 menu.classList.add("hidden");
 gameover.style.display="none";
 canvas.style.display="block";
 hud.style.display="block";
 resetGame();
 rafId=requestAnimationFrame(loop);
}

function restartGame(){ startGame(); }

function gameOver(){
 running=false;
 if(score>best){
   best=score;
   localStorage.setItem("best",best);
   bestEl.textContent=best;
 }
 finalScore.textContent=score;
 gameover.style.display="flex";
}

function backToMenu(){
 gameover.style.display="none";
 canvas.style.display="none";
 hud.style.display="none";
 menu.classList.remove("hidden");
}

function loop(t){
 if(!running) return;
 if(t-lastTime<65){
   rafId=requestAnimationFrame(loop);
   return;
 }
 lastTime=t;

 const head={x:snake[0].x+dx,y:snake[0].y+dy};

 if(head.x<0||head.y<0||head.x>=canvas.width||head.y>=canvas.height){
   gameOver(); return;
 }

 if(snake.some((s,i)=>i>0 && s.x===head.x && s.y===head.y)){
   gameOver(); return;
 }

 snake.unshift(head);

 if(head.x===food.x && head.y===food.y){
   score++;
   scoreEl.textContent=score;
   if(navigator.vibrate) navigator.vibrate(20);
   food=randomFood();
 } else {
   snake.pop();
 }

 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.shadowColor="#ff00ff";
 ctx.shadowBlur=15;
 ctx.fillStyle="#ff00ff";
 ctx.fillRect(food.x,food.y,grid,grid);

 ctx.shadowColor="#00ffff";
 ctx.shadowBlur=12;
 ctx.fillStyle="#00ffff";
 snake.forEach(p=>ctx.fillRect(p.x,p.y,grid-2,grid-2));

 rafId=requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-grid;}
 if(e.key==="ArrowDown"&&dy===0){dx=0;dy=grid;}
 if(e.key==="ArrowLeft"&&dx===0){dx=-grid;dy=0;}
 if(e.key==="ArrowRight"&&dx===0){dx=grid;dy=0;}
});

let sx=0,sy=0;

document.addEventListener("touchstart",e=>{
 const control=localStorage.getItem("control")||"swipe";
 const t=e.touches[0];
 sx=t.clientX; sy=t.clientY;

 if(control==="tap"){
   const w=innerWidth,h=innerHeight;

   if(sy<h*0.33 && dy===0){dx=0;dy=-grid;}
   else if(sy>h*0.66 && dy===0){dx=0;dy=grid;}
   else if(sx<w/2 && dx===0){dx=-grid;dy=0;}
   else if(sx>=w/2 && dx===0){dx=grid;dy=0;}
 }
},{passive:true});

document.addEventListener("touchend",e=>{
 const control=localStorage.getItem("control")||"swipe";
 if(control!=="swipe") return;

 const t=e.changedTouches[0];
 const mx=t.clientX-sx;
 const my=t.clientY-sy;

 if(Math.abs(mx)>Math.abs(my)){
   if(mx>25 && dx===0){dx=grid;dy=0;}
   if(mx<-25 && dx===0){dx=-grid;dy=0;}
 }else{
   if(my>25 && dy===0){dx=0;dy=grid;}
   if(my<-25 && dy===0){dx=0;dy=-grid;}
 }
},{passive:true});

function openSettings(){
 controlType.value=localStorage.getItem("control")||"swipe";
 menu.classList.add("hidden");
 settings.classList.remove("hidden");
}

function closeSettings(){
 settings.classList.add("hidden");
 menu.classList.remove("hidden");
}

function saveSettings(){
 localStorage.setItem("control",controlType.value);
 closeSettings();
}
</script>
</body>
</html>

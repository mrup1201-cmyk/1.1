<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>S6AKe</title>

<style>
body{
margin:0;
overflow:hidden;
background:#050510;
color:#fff;
font-family:monospace;
touch-action:none;
}

canvas{
display:none;
background:#070713;
image-rendering:pixelated;
}

.screen{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
}

.hidden{display:none!important}

button{
padding:10px 14px;
border:none;
background:#00ffff55;
color:white;
border-radius:8px;
}

#hud{
position:fixed;
top:10px;
left:10px;
display:none;
font-size:14px;
}

#controls{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
display:none;
flex-direction:column;
gap:6px;
}

.row{display:flex;gap:6px}

.ctrl{
width:55px;height:55px;
background:#00ffff33;
border:1px solid #00ffff55;
color:#00ffff;
}

.panel{
position:fixed;
inset:0;
background:#000000dd;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
overflow:auto;
padding:20px;
}

.item{
padding:8px;
border:1px solid #00ffff33;
margin:4px;
width:220px;
text-align:center;
}

</style>
</head>

<body>

<div id="menu" class="screen">
<h1>S6AKe</h1>
<button id="play">Играть</button>
<button id="shopBtn">Магазин</button>
<button id="invBtn">Инвентарь</button>
<button id="casesBtn">Кейсы</button>
<div>Монеты: <span id="coins">0</span></div>
</div>

<div id="hud">Score: <span id="score">0</span></div>

<div id="controls">
<div class="row"><button class="ctrl" data-d="up">↑</button></div>
<div class="row">
<button class="ctrl" data-d="left">←</button>
<button class="ctrl" data-d="down">↓</button>
<button class="ctrl" data-d="right">→</button>
</div>
</div>

<div id="shop" class="panel"></div>
<div id="inv" class="panel"></div>
<div id="cases" class="panel"></div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const menu=document.getElementById("menu");
const hud=document.getElementById("hud");
const controls=document.getElementById("controls");

const shop=document.getElementById("shop");
const inv=document.getElementById("inv");
const cases=document.getElementById("cases");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");

let grid=20;
let snake,food;
let dx=grid,dy=0;
let score=0;
let coins=0;
let running=false;
let last=0;
let speed=90;

let skin=null;

const skins=[
{name:"херня",color:"#444"},
{name:"ну такое",color:"#0ff"},
{name:"нормалды",color:"#0f0"},
{name:"опана",color:"#ff0"},
{name:"ахуеть",color:"#f0f"},
{name:"ебать копать",color:"#ff0055"}
];

let owned=[0];

function randFood(){
return{
x:Math.floor(Math.random()*canvas.width/grid)*grid,
y:Math.floor(Math.random()*canvas.height/grid)*grid
};
}

function reset(){
snake=[{x:200,y:200}];
dx=grid;dy=0;
score=0;
food=randFood();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#ff00ff";
ctx.fillRect(food.x,food.y,grid,grid);

let c=skin?skins[skin].color:"#00ffff";
ctx.fillStyle=c;

snake.forEach(p=>ctx.fillRect(p.x,p.y,grid-2,grid-2));
}

function loop(t){
if(!running) return;
if(t-last<speed){requestAnimationFrame(loop);return;}
last=t;

let head={x:snake[0].x+dx,y:snake[0].y+dy};

if(head.x<0||head.y<0||head.x>=canvas.width||head.y>=canvas.height){
return gameOver();
}

for(let i=0;i<snake.length;i++){
if(snake[i].x===head.x&&snake[i].y===head.y) return gameOver();
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){
score++;
coins++;
food=randFood();
}else snake.pop();

draw();
requestAnimationFrame(loop);
}

function gameOver(){
running=false;
menu.classList.remove("hidden");
canvas.style.display="none";
hud.style.display="none";
controls.style.display="none";
}

function start(){
menu.classList.add("hidden");
canvas.style.display="block";
hud.style.display="block";
controls.style.display="flex";
reset();
running=true;
last=0;
requestAnimationFrame(loop);
}

document.getElementById("play").onclick=start;

document.getElementById("shopBtn").onclick=()=>openPanel(shop,renderShop);
document.getElementById("invBtn").onclick=()=>openPanel(inv,renderInv);
document.getElementById("casesBtn").onclick=()=>openPanel(cases,renderCases);

function openPanel(p,fn){
p.style.display="flex";
fn();
}

function closePanels(){
shop.style.display="none";
inv.style.display="none";
cases.style.display="none";
}

function renderShop(){
shop.innerHTML="<h2>Магаз</h2><button onclick='closePanels()'>Назад</button>";
skins.forEach((s,i)=>{
let div=document.createElement("div");
div.className="item";
div.innerHTML=`${s.name}`;
shop.appendChild(div);
});
}

function renderInv(){
inv.innerHTML="<h2>Инвентарь</h2><button onclick='closePanels()'>Назад</button>";
owned.forEach(i=>{
let div=document.createElement("div");
div.className="item";
div.innerText=skins[i].name;
div.onclick=()=>{skin=i;closePanels();};
inv.appendChild(div);
});
}

function renderCases(){
cases.innerHTML="<h2>Кейсы</h2><button onclick='openCase()'>Открыть кейс (5 монет)</button><button onclick='closePanels()'>Назад</button>";
}

function openCase(){
if(coins<5) return;
coins-=5;
let r=Math.random();
let i=0;
if(r<0.5)i=0;
else if(r<0.75)i=1;
else if(r<0.9)i=2;
else if(r<0.97)i=3;
else if(r<0.995)i=4;
else i=5;
if(!owned.includes(i)) owned.push(i);
alert("Выпал: "+skins[i].name);
coinsEl.textContent=coins;
}

document.querySelectorAll(".ctrl").forEach(b=>{
b.onclick=()=>{
let d=b.dataset.d;
if(d==="up"&&dy===0){dx=0;dy=-grid;}
if(d==="down"&&dy===0){dx=0;dy=grid;}
if(d==="left"&&dx===0){dx=-grid;dy=0;}
if(d==="right"&&dx===0){dx=grid;dy=0;}
};
});

</script>

</body>
</html>

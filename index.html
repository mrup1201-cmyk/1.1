<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Neo 1.03 B</title>

<style>
body{
margin:0;
overflow:hidden;
background:#050510;
font-family:Arial;
color:#fff;
touch-action:none;
}

canvas{
display:none;
background:#0a0a15;
}

.screen{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:12px;
}

.hidden{display:none!important}

button,select{
padding:12px 16px;
border:none;
border-radius:10px;
font-size:16px;
}

#hud{
position:fixed;
top:10px;
left:10px;
display:none;
z-index:5;
}

#controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:none;
gap:10px;
flex-direction:column;
align-items:center;
opacity:0.4;
}

.row{display:flex;gap:10px}

.ctrlBtn{
width:62px;
height:62px;
font-size:22px;
background:rgba(0,255,255,0.35);
border-radius:14px;
backdrop-filter: blur(6px);
}

.ctrlBtn:active{
transform:scale(0.95);
opacity:0.6;
}

</style>
</head>

<body>

<div id="menu" class="screen">
<h1>Snake Neo 1.03 B</h1>
<button id="play">Играть</button>
<button id="settingsBtn">Настройки</button>
<div>Рекорд: <span id="best">0</span></div>
</div>

<div id="settings" class="screen hidden">
<h2>Настройки</h2>

<label>Скорость</label>
<select id="speed">
<option value="120">Slow</option>
<option value="90" selected>Normal</option>
<option value="70">Fast</option>
<option value="50">Ultra</option>
</select>

<br>

<label>Управление</label>
<select id="controlType">
<option value="buttons">Кнопки</option>
<option value="swipe">Свайпы</option>
<option value="tap">Тапы</option>
</select>

<button id="save">Сохранить</button>
<button id="back">Назад</button>
</div>

<div id="hud">Score: <span id="score">0</span></div>

<div id="controls">
<div class="row"><button class="ctrlBtn" data="up">↑</button></div>
<div class="row">
<button class="ctrlBtn" data="left">←</button>
<button class="ctrlBtn" data="down">↓</button>
<button class="ctrlBtn" data="right">→</button>
</div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const settings=document.getElementById("settings");
const hud=document.getElementById("hud");
const controls=document.getElementById("controls");

const bestEl=document.getElementById("best");
const scoreEl=document.getElementById("score");
const speedEl=document.getElementById("speed");
const controlType=document.getElementById("controlType");

let grid=20;
let snake,food;
let dx=grid,dy=0;
let score=0;
let speed=90;
let running=false;
let last=0;

let particles=[];

let best=localStorage.getItem("best")||0;
bestEl.textContent=best;

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

function randomFood(){
return{
x:Math.floor(Math.random()*canvas.width/grid)*grid,
y:Math.floor(Math.random()*canvas.height/grid)*grid
};
}

function reset(){
snake=[{x:200,y:200}];
dx=grid;dy=0;
score=0;
scoreEl.textContent=0;
food=randomFood();
}

function spawnParticles(x,y){
for(let i=0;i<14;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:30,
alpha:1
});
}
}

function updateParticles(){
for(let p of particles){
p.x+=p.vx;
p.y+=p.vy;
p.life--;
p.alpha*=0.92;
}

particles=particles.filter(p=>p.life>0);
}

function drawParticles(){
for(let p of particles){
ctx.fillStyle=`rgba(0,255,255,${p.alpha})`;
ctx.fillRect(p.x,p.y,3,3);
}
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.shadowColor="#00ffff";
ctx.shadowBlur=18;

ctx.fillStyle="#ff00ff";
ctx.fillRect(food.x,food.y,grid,grid);

ctx.fillStyle="#00ffff";
snake.forEach(p=>ctx.fillRect(p.x,p.y,grid-2,grid-2));

drawParticles();
}

function loop(t){
if(!running) return;

if(t-last<speed){
requestAnimationFrame(loop);
return;
}
last=t;

let head={x:snake[0].x+dx,y:snake[0].y+dy};

if(head.x<0||head.y<0||head.x>=canvas.width||head.y>=canvas.height){
return gameOver();
}

for(let i=0;i<snake.length;i++){
if(snake[i].x===head.x&&snake[i].y===head.y){
return gameOver();
}
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){
score++;
scoreEl.textContent=score;

spawnParticles(food.x,food.y);

if(navigator.vibrate) navigator.vibrate(25);

food=randomFood();
}else{
snake.pop();
}

updateParticles();
draw();

requestAnimationFrame(loop);
}

function gameOver(){
running=false;

if(score>best){
best=score;
localStorage.setItem("best",best);
bestEl.textContent=best;
}

menu.classList.remove("hidden");
canvas.style.display="none";
hud.style.display="none";
controls.style.display="none";
}

function start(){
if(running) return;

menu.classList.add("hidden");
settings.classList.add("hidden");

canvas.style.display="block";
hud.style.display="block";
controls.style.display="flex";

speed=+localStorage.getItem("speed")||speed;
reset();
running=true;
last=0;
requestAnimationFrame(loop);
}

document.getElementById("play").onclick=start;

document.getElementById("settingsBtn").onclick=()=>{
menu.classList.add("hidden");
settings.classList.remove("hidden");
controlType.value=localStorage.getItem("control")||"buttons";
speedEl.value=localStorage.getItem("speed")||90;
};

document.getElementById("back").onclick=()=>{
settings.classList.add("hidden");
menu.classList.remove("hidden");
};

document.getElementById("save").onclick=()=>{
localStorage.setItem("speed",speedEl.value);
localStorage.setItem("control",controlType.value);
settings.classList.add("hidden");
menu.classList.remove("hidden");
};

document.querySelectorAll(".ctrlBtn").forEach(b=>{
b.addEventListener("click",()=>{
let d=b.getAttribute("data");

if(d==="up"&&dy===0){dx=0;dy=-grid;}
if(d==="down"&&dy===0){dx=0;dy=grid;}
if(d==="left"&&dx===0){dx=-grid;dy=0;}
if(d==="right"&&dx===0){dx=grid;dy=0;}
});
});

document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-grid;}
if(e.key==="ArrowDown"&&dy===0){dx=0;dy=grid;}
if(e.key==="ArrowLeft"&&dx===0){dx=-grid;dy=0;}
if(e.key==="ArrowRight"&&dx===0){dx=grid;dy=0;}
});

</script>

</body>
</html>

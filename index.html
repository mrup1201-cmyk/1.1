<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>S6AKE 1.0 FIXED</title>

<style>
body{
margin:0;
background:#050510;
color:#fff;
font-family:Arial;
overflow:hidden;
touch-action:none;
}

canvas{display:none;background:#0a0a0a}

.screen{
position:fixed;inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
}

.hidden{display:none!important}

button{
padding:10px 14px;
border:none;
border-radius:10px;
}

#hud{
position:fixed;
top:10px;left:10px;
display:none;
}

#controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:none;
}

.ctrlWrap{
display:flex;
flex-direction:column;
gap:8px;
align-items:center;
}

.row{
display:flex;
gap:8px;
}

.ctrl{
width:55px;height:55px;
background:rgba(0,255,255,0.35);
border-radius:10px;
font-size:18px;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="screen">
<h1>S6AKE 1.0 FIXED</h1>
<button id="play">Играть</button>
<button id="settingsBtn">Настройки</button>
<button id="shopBtn">Кейсы</button>
<button id="invBtn">Инвентарь</button>
<div>S6Bit: <span id="moneyUI">0</span></div>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen hidden">
<h2>Настройки</h2>
<button onclick="setMode('buttons')">Кнопки</button>
<button onclick="setMode('swipe')">Свайпы</button>
<button onclick="backMenu()">Назад</button>
</div>

<!-- SHOP -->
<div id="shop" class="screen hidden">
<h2>Кейс (5 S6Bit)</h2>
<button id="openCase">Открыть</button>
<button onclick="backMenu()">Назад</button>
<div id="caseAnim"></div>
</div>

<!-- INVENTORY -->
<div id="inv" class="screen hidden">
<h2>Инвентарь</h2>
<div id="invList"></div>
<button onclick="backMenu()">Назад</button>
</div>

<!-- HUD -->
<div id="hud">S6Bit: <span id="money"></span></div>

<!-- CONTROLS -->
<div id="controls">
<div class="ctrlWrap">

<div class="row">
<button class="ctrl" data="up">-</button>
<button class="ctrl" data="up">1</button>
<button class="ctrl" data="up">-</button>
</div>

<div class="row">
<button class="ctrl" data="left">1</button>
<button class="ctrl" data="down">1</button>
<button class="ctrl" data="right">1</button>
</div>

</div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let grid=20;
let snake,food;
let dx=grid,dy=0;
let running=false;
let last=0;
let speed=90;

let money=0;
let mode="buttons";

// SKINS
const skins=[
{id:"s1",name:"херня",color:"#777"},
{id:"s2",name:"ну такое",color:"#0ff"},
{id:"s3",name:"нормалды",color:"#00f"},
{id:"s4",name:"опана",color:"#a0f"},
{id:"s5",name:"ахуеть",color:"#f80"},
{id:"s6",name:"ебать копать",color:"#ff0"}
];

let owned=skins.map(s=>s.id);
let equipped="s2";

// SAVE
function save(){
localStorage.setItem("money",money);
localStorage.setItem("eq",equipped);
}

// FOOD
function spawn(){
return{
x:Math.floor(Math.random()*canvas.width/grid)*grid,
y:Math.floor(Math.random()*canvas.height/grid)*grid
};
}

function reset(){
snake=[{x:200,y:200}];
dx=grid;dy=0;
food=spawn();
}

// COLOR
function color(){
return skins.find(s=>s.id===equipped).color;
}

// DRAW
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#ff00ff";
ctx.fillRect(food.x,food.y,grid,grid);

ctx.fillStyle=color();
snake.forEach(p=>ctx.fillRect(p.x,p.y,grid-2,grid-2));
}

// LOOP
function loop(t){
if(!running)return;
if(t-last<speed){requestAnimationFrame(loop);return}
last=t;

let h={x:snake[0].x+dx,y:snake[0].y+dy};

for(let i=0;i<snake.length;i++)
if(snake[i].x===h.x&&snake[i].y===h.y) return gameOver();

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){
money+=1;
food=spawn();
}else snake.pop();

draw();
requestAnimationFrame(loop);
}

// GAME
function start(){
menu.classList.add("hidden");
canvas.style.display="block";
hud.style.display="block";
reset();
running=true;
requestAnimationFrame(loop);
}

function gameOver(){
running=false;
save();
menu.classList.remove("hidden");
canvas.style.display="none";
hud.style.display="none";
}

// MENU
function backMenu(){
menu.classList.remove("hidden");
settings.classList.add("hidden");
shop.classList.add("hidden");
inv.classList.add("hidden");
}

// CONTROLS FIXED
document.querySelectorAll(".ctrl").forEach(b=>{
b.onclick=()=>{
let d=b.dataset.data || b.getAttribute("data");

if(d==="up"&&dy===0){dx=0;dy=-grid}
if(d==="down"&&dy===0){dx=0;dy=grid}
if(d==="left"&&dx===0){dx=-grid;dy=0}
if(d==="right"&&dx===0){dx=grid;dy=0}
};
});

// SETTINGS
function setMode(m){mode=m}

// CASE ANIMATION
document.getElementById("openCase").onclick=()=>{
let box=document.getElementById("caseAnim");
box.innerHTML="🎰 крутится...";
setTimeout(()=>{
let r=Math.random();
if(r<0.7){
let s=skins[Math.floor(Math.random()*skins.length)];
owned.push(s.id);
box.innerHTML="выпало: "+s.name;
}else{
money+=Math.floor(Math.random()*10)+1;
box.innerHTML="S6Bit бонус!";
}
save();
renderInv();
},1200);
};

// INVENTORY
function renderInv(){
let el=document.getElementById("invList");
el.innerHTML="";
skins.forEach(s=>{
let b=document.createElement("button");
b.innerText=s.name;
b.style.background=s.color;
b.onclick=()=>equipped=s.id;
el.appendChild(b);
});
}

// INIT ALL SKINS
renderInv();

</script>

</body>
</html>

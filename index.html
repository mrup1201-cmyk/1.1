<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Neo 1.03 A</title>

<style>
body{
margin:0;
overflow:hidden;
background:#050510;
color:#fff;
font-family:Arial;
touch-action:none;
}

canvas{
display:none;
background:radial-gradient(circle at center,#0b0b1a,#050510);
}

.screen{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:12px;
}

.hidden{display:none!important}

button,select{
padding:12px 16px;
border:none;
border-radius:10px;
font-size:16px;
}

#hud{
position:fixed;
top:10px;
left:10px;
display:none;
font-size:18px;
}

#controls{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
display:none;
flex-direction:column;
align-items:center;
gap:8px;
}

.row{display:flex;gap:10px}

.ctrlBtn{
width:60px;
height:60px;
border-radius:14px;
background:rgba(0,255,255,0.35);
backdrop-filter:blur(6px);
color:white;
font-size:22px;
border:1px solid rgba(0,255,255,0.4);
}

.ctrlBtn:active{
transform:scale(0.95);
}
</style>
</head>

<body>

<div id="menu" class="screen">
<h1>Snake Neo 1.03 A</h1>
<button id="play">Играть</button>
<button id="settingsBtn">Настройки</button>
<div>Рекорд: <span id="best">0</span></div>
</div>

<div id="settings" class="screen hidden">
<h2>Настройки</h2>

<label>Скорость</label>
<select id="speed">
<option value="120">Slow</option>
<option value="90" selected>Normal</option>
<option value="70">Fast</option>
<option value="50">Ultra</option>
</select>

<button id="save">Сохранить</button>
<button id="back">Назад</button>
</div>

<div id="hud">Score: <span id="score">0</span></div>

<div id="controls">
<div class="row">
<button class="ctrlBtn" data-dir="up">↑</button>
</div>
<div class="row">
<button class="ctrlBtn" data-dir="left">←</button>
<button class="ctrlBtn" data-dir="down">↓</button>
<button class="ctrlBtn" data-dir="right">→</button>
</div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const settings=document.getElementById("settings");
const hud=document.getElementById("hud");
const controls=document.getElementById("controls");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const speedEl=document.getElementById("speed");

let grid=20;

let snake=[];
let food={};
let dx=grid,dy=0;

let score=0;
let running=false;

let last=0;
let speed=90;

let inputLock=false;
let canTurn=true;

let particles=[];

let best=localStorage.getItem("best")||0;
bestEl.textContent=best;

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

function randomFood(){
return{
x:Math.floor(Math.random()*canvas.width/grid)*grid,
y:Math.floor(Math.random()*canvas.height/grid)*grid
};
}

function reset(){
snake=[{x:200,y:200}];
dx=grid;dy=0;
score=0;
scoreEl.textContent=0;
food=randomFood();
particles=[];
}

function spawnParticles(x,y){
for(let i=0;i<10;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,
life:20
});
}
}

function drawParticles(){
for(let p of particles){
ctx.fillStyle="rgba(0,255,255,0.8)";
ctx.fillRect(p.x,p.y,3,3);
p.x+=p.vx;
p.y+=p.vy;
p.life--;
}
particles=particles.filter(p=>p.life>0);
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#ff00ff";
ctx.fillRect(food.x,food.y,grid,grid);

ctx.fillStyle="#00ffff";
snake.forEach(p=>{
ctx.fillRect(p.x,p.y,grid-2,grid-2);
});

drawParticles();
}

function gameOver(){
running=false;

if(score>best){
best=score;
localStorage.setItem("best",best);
bestEl.textContent=best;
}

menu.classList.remove("hidden");
canvas.style.display="none";
hud.style.display="none";
controls.style.display="none";
}

function loop(t){
if(!running) return;

if(t-last<speed){
requestAnimationFrame(loop);
return;
}
last=t;

canTurn=true;

let head={x:snake[0].x+dx,y:snake[0].y+dy};

if(head.x<0||head.y<0||head.x>=canvas.width||head.y>=canvas.height){
return gameOver();
}

for(let i=0;i<snake.length;i++){
if(snake[i].x===head.x&&snake[i].y===head.y){
return gameOver();
}
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){
score++;
scoreEl.textContent=score;
food=randomFood();
spawnParticles(food.x,food.y);
}else{
snake.pop();
}

draw();
requestAnimationFrame(loop);
}

function setDir(nx,ny){
if(inputLock||!canTurn) return;

inputLock=true;
setTimeout(()=>inputLock=false,60);

canTurn=false;

dx=nx;
dy=ny;
}

function start(){
if(running) return;

menu.classList.add("hidden");
settings.classList.add("hidden");

canvas.style.display="block";
hud.style.display="block";
controls.style.display="flex";

speed=+speedEl.value;

reset();
running=true;
last=0;
requestAnimationFrame(loop);
}

document.getElementById("play").onclick=start;

document.getElementById("settingsBtn").onclick=()=>{
menu.classList.add("hidden");
settings.classList.remove("hidden");
};

document.getElementById("back").onclick=()=>{
settings.classList.add("hidden");
menu.classList.remove("hidden");
};

document.getElementById("save").onclick=()=>{
speed=+speedEl.value;
localStorage.setItem("speed",speed);
settings.classList.add("hidden");
menu.classList.remove("hidden");
};

document.querySelectorAll(".ctrlBtn").forEach(btn=>{
btn.onclick=()=>{
let d=btn.dataset.dir;

if(d==="up") setDir(0,-grid);
if(d==="down") setDir(0,grid);
if(d==="left") setDir(-grid,0);
if(d==="right") setDir(grid,0);
};
});

document.addEventListener("keydown",(e)=>{
if(e.key==="ArrowUp") setDir(0,-grid);
if(e.key==="ArrowDown") setDir(0,grid);
if(e.key==="ArrowLeft") setDir(-grid,0);
if(e.key==="ArrowRight") setDir(grid,0);
});

</script>

</body>
</html>

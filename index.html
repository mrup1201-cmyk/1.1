<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>S6AKE FINAL</title>

<style>
body{
margin:0;
background:#050510;
color:#fff;
font-family:Arial;
overflow:hidden;
touch-action:none;
}

canvas{
display:none;
background:#0a0a0a;
}

.screen{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
}

.hidden{display:none!important}

button{
padding:10px 14px;
border-radius:10px;
border:none;
font-size:14px;
}

#hud{
position:fixed;
top:10px;
left:10px;
display:none;
}

#controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:none;
}

.row{display:flex;gap:10px}

.ctrl{
width:55px;
height:55px;
background:rgba(0,255,255,0.35);
border-radius:10px;
font-size:18px;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="screen">
<h1>S6AKE</h1>
<button id="play">Играть</button>
<button id="shopBtn">Кейсы</button>
<button id="invBtn">Инвентарь</button>

<div>Score: <span id="scoreUI">0</span></div>
<div>S6Bit: <span id="moneyUI">0</span></div>
</div>

<!-- SHOP -->
<div id="shop" class="screen hidden">
<h2>Кейс (5 S6Bit)</h2>
<button id="openCase">Открыть</button>
<button id="backShop">Назад</button>
</div>

<!-- INVENTORY -->
<div id="inv" class="screen hidden">
<h2>Инвентарь</h2>
<div id="invList"></div>
<button id="backInv">Назад</button>
</div>

<!-- HUD -->
<div id="hud">
Score: <span id="score"></span> | S6Bit: <span id="money"></span>
</div>

<!-- CONTROLS -->
<div id="controls">
<div class="row">
<button class="ctrl" data="up">↑</button>
</div>
<div class="row">
<button class="ctrl" data="left">←</button>
<button class="ctrl" data="down">↓</button>
<button class="ctrl" data="right">→</button>
</div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let grid=20;
let snake,food;
let dx=grid,dy=0;

let running=false;
let last=0;
let speed=90;

let score=0;
let money=0;

// SKINS
const skins=[
{id:"s1",name:"херня",color:"#777"},
{id:"s2",name:"ну такое",color:"#0ff"},
{id:"s3",name:"нормалды",color:"#00f"},
{id:"s4",name:"опана",color:"#a0f"},
{id:"s5",name:"ахуеть",color:"#f80"},
{id:"s6",name:"ебать копать",color:"#ff0"}
];

let owned=JSON.parse(localStorage.getItem("owned")||"[]");
if(!owned.length) owned=skins.map(s=>s.id);

let equipped=localStorage.getItem("eq")||"s2";
money=Number(localStorage.getItem("money")||0);

function save(){
localStorage.setItem("owned",JSON.stringify(owned));
localStorage.setItem("eq",equipped);
localStorage.setItem("money",money);
}

// FOOD
function spawn(){
return{
x:Math.floor(Math.random()*canvas.width/grid)*grid,
y:Math.floor(Math.random()*canvas.height/grid)*grid
};
}

// RESET
function reset(){
snake=[{x:200,y:200}];
dx=grid;dy=0;
score=0;
food=spawn();
}

// COLOR
function color(){
return skins.find(s=>s.id===equipped)?.color||"#0ff";
}

// DRAW
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#ff00ff";
ctx.fillRect(food.x,food.y,grid,grid);
ctx.fillStyle=color();
snake.forEach(p=>ctx.fillRect(p.x,p.y,grid-2,grid-2));
}

// LOOP
function loop(t){
if(!running)return;
if(t-last<speed){requestAnimationFrame(loop);return}
last=t;

let h={x:snake[0].x+dx,y:snake[0].y+dy};

if(h.x<0||h.y<0||h.x>=canvas.width||h.y>=canvas.height){
return gameOver();
}

for(let i=0;i<snake.length;i++){
if(snake[i].x===h.x&&snake[i].y===h.y) return gameOver();
}

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){
score++;
money+=0.4;
if(Math.random()<0.1) money+=2;
food=spawn();
}else snake.pop();

updateUI();
draw();
requestAnimationFrame(loop);
}

// UI
function updateUI(){
document.getElementById("scoreUI").innerText=score;
document.getElementById("moneyUI").innerText=money.toFixed(1);
document.getElementById("score").innerText=score;
document.getElementById("money").innerText=money.toFixed(1);
}

// START
function start(){
menu.classList.add("hidden");
canvas.style.display="block";
hud.style.display="block";
controls.style.display="block";

reset();
running=true;
requestAnimationFrame(loop);
}

// GAME OVER
function gameOver(){
running=false;
save();

menu.classList.remove("hidden");
canvas.style.display="none";
hud.style.display="none";
controls.style.display="none";
}

// MENU
document.getElementById("play").onclick=start;

document.getElementById("shopBtn").onclick=()=>{
menu.classList.add("hidden");
shop.classList.remove("hidden");
};

document.getElementById("invBtn").onclick=()=>{
menu.classList.add("hidden");
inv.classList.remove("hidden");
render();
};

document.getElementById("backShop").onclick=()=>{
shop.classList.add("hidden");
menu.classList.remove("hidden");
};

document.getElementById("backInv").onclick=()=>{
inv.classList.add("hidden");
menu.classList.remove("hidden");
};

// CASE
document.getElementById("openCase").onclick=()=>{
if(money<5)return alert("нет S6Bit");
money-=5;

if(Math.random()<0.7){
owned.push(skins[Math.floor(Math.random()*skins.length)].id);
}else{
money+=Math.floor(Math.random()*10)+1;
}

save();
updateUI();
render();
};

// INVENTORY
function render(){
const el=document.getElementById("invList");
el.innerHTML="";
owned.forEach(id=>{
const s=skins.find(x=>x.id===id);
const b=document.createElement("button");
b.innerText=s.name;
b.style.background=s.color;
b.onclick=()=>{
equipped=id;
save();
updateUI();
};
el.appendChild(b);
});
}

// CONTROLS
document.querySelectorAll(".ctrl").forEach(b=>{
b.onclick=()=>{
let d=b.getAttribute("data");

if(d==="up"&&dy===0){dx=0;dy=-grid}
if(d==="down"&&dy===0){dx=0;dy=grid}
if(d==="left"&&dx===0){dx=-grid;dy=0}
if(d==="right"&&dx===0){dx=grid;dy=0}
};
});

updateUI();

</script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>S6AKe A.1 FIX REBUILD</title>

<style>
body{margin:0;background:#050510;color:#fff;font-family:Arial;overflow:hidden}
canvas{display:none;background:#0a0a15}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.hidden{display:none!important}
button,select{padding:10px 14px;border-radius:10px;border:none}
#hud{position:fixed;top:10px;left:10px;display:none}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:none}
.row{display:flex;gap:8px;justify-content:center}
.ctrl{width:60px;height:60px;opacity:.4}
.panel{position:fixed;inset:0;background:#050510;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
</style>
</head>

<body>

<div id="menu" class="screen">
<h1>S6AKe A.1 FIX</h1>
<button onclick="start()">Играть</button>
<button onclick="openShop()">Магазин</button>
<button onclick="openInv()">Инвентарь</button>
<button onclick="openSettings()">Настройки</button>
<div>Монеты: <span id="coins">0</span></div>
</div>

<div id="shop" class="panel">
<h2>Магазин (кейсы)</h2>
<button onclick="buyCase()">Кейс (5)</button>
<button onclick="backMenu()">Назад</button>
</div>

<div id="inv" class="panel">
<h2>Инвентарь</h2>
<div id="invList"></div>
<button onclick="backMenu()">Назад</button>
</div>

<div id="settings" class="panel">
<h2>Настройки</h2>
<select id="speed">
<option value="140">Slow</option>
<option value="100" selected>Normal</option>
<option value="70">Fast</option>
</select>

<select id="control">
<option value="btn">Buttons</option>
<option value="swipe">Swipe</option>
</select>

<button onclick="saveSettings()">Save</button>
<button onclick="backMenu()">Назад</button>
</div>

<div id="hud">Score: <span id="score">0</span></div>

<div id="controls">
<div class="row">
<button class="ctrl ctrlUp">↑</button>
</div>
<div class="row">
<button class="ctrl ctrlLeft">←</button>
<button class="ctrl ctrlDown">↓</button>
<button class="ctrl ctrlRight">→</button>
</div>
</div>

<canvas id="c"></canvas>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let grid=20;
let snake,food,dx,dy;
let score=0;
let coins=0;
let speed=100;
let running=false;
let loopId;

let skins=["херня","ну такое","нормалды","опана","ахуеть","ебать копать"];
let owned=JSON.parse(localStorage.getItem("owned")||"[]");

function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
addEventListener("resize",resize);resize();

function save(){localStorage.setItem("owned",JSON.stringify(owned));}

function updateUI(){
document.getElementById("coins").textContent=coins;
}

function start(){
document.getElementById("menu").style.display="none";
canvas.style.display="block";
document.getElementById("hud").style.display="block";
document.getElementById("controls").style.display="block";
reset();
running=true;
game();
}

function reset(){
snake=[{x:200,y:200}];
dx=grid;dy=0;
score=0;
food={x:100,y:100};
}

function foodSpawn(){
food={x:Math.floor(Math.random()*canvas.width/grid)*grid,
y:Math.floor(Math.random()*canvas.height/grid)*grid};
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#ff00ff";
ctx.fillRect(food.x,food.y,grid,grid);
ctx.fillStyle="#00ffff";
snake.forEach(s=>ctx.fillRect(s.x,s.y,grid-2,grid-2));
}

function game(){
if(!running)return;

let head={x:snake[0].x+dx,y:snake[0].y+dy};

if(head.x<0||head.y<0||head.x>canvas.width||head.y>canvas.height) return gameOver();

for(let i=0;i<snake.length;i++){
if(snake[i].x===head.x&&snake[i].y===head.y) return gameOver();
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){
score++;coins++;
updateUI();
foodSpawn();
}else snake.pop();

draw();
setTimeout(()=>requestAnimationFrame(game),speed);
}

function gameOver(){
running=false;
document.getElementById("menu").style.display="flex";
canvas.style.display="none";
document.getElementById("hud").style.display="none";
document.getElementById("controls").style.display="none";
}

function buyCase(){
if(coins<5)return;
coins-=5;
let skin=skins[Math.floor(Math.random()*skins.length)];
if(!owned.includes(skin))owned.push(skin);
save();
updateUI();
alert("Выпало: "+skin);
}

function openShop(){document.getElementById("shop").style.display="flex";}
function openInv(){
document.getElementById("inv").style.display="flex";
document.getElementById("invList").innerHTML=owned.map(s=>"• "+s).join("<br>");
}
function openSettings(){document.getElementById("settings").style.display="flex";}
function backMenu(){
document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
document.getElementById("menu").style.display="flex";
}

document.querySelector(".ctrlUp").onclick=()=>{if(dy===0){dx=0;dy=-grid}};
document.querySelector(".ctrlDown").onclick=()=>{if(dy===0){dx=0;dy=grid}};
document.querySelector(".ctrlLeft").onclick=()=>{if(dx===0){dx=-grid;dy=0}};
document.querySelector(".ctrlRight").onclick=()=>{if(dx===0){dx=grid;dy=0}};

updateUI();

</script>

</body>
</html>

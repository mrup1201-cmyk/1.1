<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Neo 1.01 Fixed Hotfix</title>
<style>
body{margin:0;background:#050510;color:#fff;font-family:Arial;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.hidden{display:none}
button,select{padding:12px 18px;border-radius:10px;border:none}
canvas{display:none;background:#0a0a15}
#hud{display:none;position:fixed;top:10px;left:10px}
</style>
</head>
<body>
<div id="menu" class="screen">
<h1>Snake Neo</h1>
<button id="playBtn">Играть</button>
<button id="settingsBtn">Настройки</button>
<div>Рекорд: <span id="best">0</span></div>
</div>

<div id="settings" class="screen hidden">
<select id="controlType">
<option value="swipe">Свайпы</option>
<option value="tap">Тапы</option>
</select>
<button id="saveBtn">Сохранить</button>
<button id="backBtn">Назад</button>
</div>

<div id="hud">Очки: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

const menu=document.getElementById('menu');
const settings=document.getElementById('settings');
const bestEl=document.getElementById('best');
const scoreEl=document.getElementById('score');
const controlType=document.getElementById('controlType');

function resize(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

let best=Number(localStorage.getItem('best')||0);
bestEl.textContent=best;

const grid=20;
let snake,food,dx,dy,score;
let running=false;

function randomFood(){
 return {
  x:Math.floor(Math.random()*(canvas.width/grid))*grid,
  y:Math.floor(Math.random()*(canvas.height/grid))*grid
 };
}

function resetGame(){
 snake=[{x:200,y:200}];
 dx=grid; dy=0;
 score=0;
 scoreEl.textContent=0;
 food=randomFood();
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle="#ff00ff";
 ctx.fillRect(food.x,food.y,grid,grid);

 ctx.fillStyle="#00ffff";
 snake.forEach(p=>ctx.fillRect(p.x,p.y,grid-2,grid-2));
}

function loop(){
 if(!running) return;

 const head={x:snake[0].x+dx,y:snake[0].y+dy};

 if(head.x<0||head.y<0||head.x>=canvas.width||head.y>=canvas.height){
  gameOver(); return;
 }

 snake.unshift(head);

 if(head.x===food.x && head.y===food.y){
  score++;
  scoreEl.textContent=score;
  food=randomFood();
 } else {
  snake.pop();
 }

 for(let i=1;i<snake.length;i++){
  if(head.x===snake[i].x && head.y===snake[i].y){
   gameOver(); return;
  }
 }

 draw();
 setTimeout(()=>requestAnimationFrame(loop),80);
}

function startGame(){
 menu.classList.add('hidden');
 canvas.style.display='block';
 document.getElementById('hud').style.display='block';
 resetGame();
 draw(); /* сразу рисуем змейку */
 running=true;
 requestAnimationFrame(loop);
}

function gameOver(){
 running=false;
 if(score>best){
  best=score;
  localStorage.setItem('best',best);
  bestEl.textContent=best;
 }
 alert('Игра окончена. Счёт: '+score);
 canvas.style.display='none';
 document.getElementById('hud').style.display='none';
 menu.classList.remove('hidden');
}

document.getElementById('playBtn').onclick=startGame;

document.getElementById('settingsBtn').onclick=()=>{
 settings.classList.remove('hidden');
 menu.classList.add('hidden');
};

document.getElementById('backBtn').onclick=()=>{
 settings.classList.add('hidden');
 menu.classList.remove('hidden');
};

document.getElementById('saveBtn').onclick=()=>{
 localStorage.setItem('control',controlType.value);
 settings.classList.add('hidden');
 menu.classList.remove('hidden');
};

let sx=0,sy=0;

document.addEventListener('touchstart',e=>{
 sx=e.touches[0].clientX;
 sy=e.touches[0].clientY;

 const mode=localStorage.getItem('control')||'swipe';

 if(mode==='tap'){
   const x=sx,y=sy,w=innerWidth,h=innerHeight;
   if(y<h*0.33 && dy===0){dx=0;dy=-grid;}
   else if(y>h*0.66 && dy===0){dx=0;dy=grid;}
   else if(x<w/2 && dx===0){dx=-grid;dy=0;}
   else if(x>=w/2 && dx===0){dx=grid;dy=0;}
 }
});

document.addEventListener('touchend',e=>{
 const mode=localStorage.getItem('control')||'swipe';
 if(mode!=='swipe') return;

 const ex=e.changedTouches[0].clientX;
 const ey=e.changedTouches[0].clientY;

 const mx=ex-sx,my=ey-sy;

 if(Math.abs(mx)>Math.abs(my)){
   if(mx>20 && dx===0){dx=grid;dy=0;}
   if(mx<-20 && dx===0){dx=-grid;dy=0;}
 }else{
   if(my>20 && dy===0){dx=0;dy=grid;}
   if(my<-20 && dy===0){dx=0;dy=-grid;}
 }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Neo 1.01 Stable</title>
<style>
body{margin:0;background:#050510;color:white;font-family:Arial;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.hidden{display:none!important}
button,select{padding:12px 18px;border:none;border-radius:10px}
canvas{display:none;background:#0a0a15}
#hud{display:none;position:fixed;top:10px;left:10px}
</style>
</head>
<body>

<div id="menu" class="screen">
<h1>Snake Neo 1.01 Stable</h1>
<button id="playBtn">Играть</button>
<button id="settingsBtn">Настройки</button>
<p>Рекорд: <span id="best">0</span></p>
</div>

<div id="settings" class="screen hidden">
<h2>Настройки</h2>
<select id="controlType">
<option value="swipe">Свайпы</option>
<option value="tap">Тапы</option>
</select>
<button id="saveBtn">Сохранить</button>
<button id="backBtn">Назад</button>
</div>

<div id="hud">Очки: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>
const menu=document.getElementById("menu");
const settings=document.getElementById("settings");
const playBtn=document.getElementById("playBtn");
const settingsBtn=document.getElementById("settingsBtn");
const saveBtn=document.getElementById("saveBtn");
const backBtn=document.getElementById("backBtn");
const controlType=document.getElementById("controlType");
const bestEl=document.getElementById("best");
const scoreEl=document.getElementById("score");
const hud=document.getElementById("hud");

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let best=Number(localStorage.getItem("best")||0);
bestEl.textContent=best;

const grid=20;
let snake=[];
let food={};
let dx=grid;
let dy=0;
let score=0;
let running=false;
let timer=null;

function randomFood(){
 return {
  x:Math.floor(Math.random()*(canvas.width/grid))*grid,
  y:Math.floor(Math.random()*(canvas.height/grid))*grid
 };
}

function resetGame(){
 snake=[{x:200,y:200}];
 dx=grid;
 dy=0;
 score=0;
 scoreEl.textContent="0";
 food=randomFood();
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle="#ff00ff";
 ctx.fillRect(food.x,food.y,grid,grid);

 ctx.fillStyle="#00ffff";
 snake.forEach(p=>ctx.fillRect(p.x,p.y,grid-2,grid-2));
}

function gameOver(){
 running=false;
 clearInterval(timer);

 if(score>best){
  best=score;
  localStorage.setItem("best",best);
  bestEl.textContent=best;
 }

 alert("Игра окончена. Счёт: "+score);

 canvas.style.display="none";
 hud.style.display="none";
 menu.classList.remove("hidden");
}

function tick(){
 const head={x:snake[0].x+dx,y:snake[0].y+dy};

 if(head.x<0||head.y<0||head.x>=canvas.width||head.y>=canvas.height){
  gameOver();
  return;
 }

 for(let i=0;i<snake.length;i++){
  if(head.x===snake[i].x && head.y===snake[i].y){
   gameOver();
   return;
  }
 }

 snake.unshift(head);

 if(head.x===food.x && head.y===food.y){
  score++;
  scoreEl.textContent=score;
  food=randomFood();
 }else{
  snake.pop();
 }

 draw();
}

function startGame(){
 clearInterval(timer);

 menu.classList.add("hidden");
 settings.classList.add("hidden");

 canvas.style.display="block";
 hud.style.display="block";

 resetGame();
 draw();

 running=true;
 timer=setInterval(tick,90);
}

playBtn.addEventListener("click",startGame);

settingsBtn.addEventListener("click",()=>{
 menu.classList.add("hidden");
 settings.classList.remove("hidden");
});

backBtn.addEventListener("click",()=>{
 settings.classList.add("hidden");
 menu.classList.remove("hidden");
});

saveBtn.addEventListener("click",()=>{
 localStorage.setItem("control",controlType.value);
 settings.classList.add("hidden");
 menu.classList.remove("hidden");
});

let startX=0,startY=0;

document.addEventListener("touchstart",(e)=>{
 startX=e.touches[0].clientX;
 startY=e.touches[0].clientY;

 if((localStorage.getItem("control")||"swipe")==="tap"){
   const w=innerWidth,h=innerHeight;

   if(startY<h*0.33 && dy===0){dx=0;dy=-grid;}
   else if(startY>h*0.66 && dy===0){dx=0;dy=grid;}
   else if(startX<w/2 && dx===0){dx=-grid;dy=0;}
   else if(startX>=w/2 && dx===0){dx=grid;dy=0;}
 }
});

document.addEventListener("touchend",(e)=>{
 if((localStorage.getItem("control")||"swipe")!=="swipe") return;

 const endX=e.changedTouches[0].clientX;
 const endY=e.changedTouches[0].clientY;

 const mx=endX-startX;
 const my=endY-startY;

 if(Math.abs(mx)>Math.abs(my)){
   if(mx>20 && dx===0){dx=grid;dy=0;}
   if(mx<-20 && dx===0){dx=-grid;dy=0;}
 }else{
   if(my>20 && dy===0){dx=0;dy=grid;}
   if(my<-20 && dy===0){dx=0;dy=-grid;}
 }
});
</script>
</body>
</html>
